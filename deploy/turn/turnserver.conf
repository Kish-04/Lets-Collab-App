# coturn node for Let's Collab. Run one node per region; every node uses the SAME static-auth-secret
# as the backend's TURN_SECRET, so one short-lived credential works on all of them.
# Secrets and the public IP are passed on the command line (see docker-compose.yml `coturn`).

listening-port=3478
tls-listening-port=5349

# Relay range; open these UDP ports on the host firewall / security group
min-port=49160
max-port=49200

# Time-limited credentials (TURN REST API): username "<expiry>:<user>", password HMAC-SHA1(secret, username)
use-auth-secret
realm=letscollab

fingerprint
stale-nonce=600
no-cli
no-multicast-peers

# Never relay into private/internal ranges (prevents using TURN to reach your own network)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user quotas so a leaked credential cannot exhaust the relay
user-quota=12
total-quota=1200

# TLS (turns:) - mount real certificates for production
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
