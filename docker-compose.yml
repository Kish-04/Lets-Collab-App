services:
  mongodb:
    image: mongo:6
    container_name: drcsfa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drcsfa-hardhat
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: drcsfa-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: drcsfa-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc rm -r --force myminio/ircp-evidence-bucket || true;
      /usr/bin/mc mb myminio/ircp-evidence-bucket || true;
      /usr/bin/mc anonymous set download myminio/ircp-evidence-bucket;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drcsfa-backend
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    command: npm run dev
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      hardhat:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ircp_db
      - RPC_URL=http://hardhat:8545
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-development-only-jwt-secret-change-me-1234567890}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID:-}
      - EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID:-}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY:-}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY:-}
      - LOG_OTP=${LOG_OTP:-true}
      - ALLOW_MOCK_BLOCKCHAIN=${ALLOW_MOCK_BLOCKCHAIN:-true}
      - METERED_DOMAIN=${METERED_DOMAIN:-}
      - METERED_SECRET_KEY=${METERED_SECRET_KEY:-}
      - TURN_URL=${TURN_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      - USE_S3=true
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET_NAME=ircp-evidence-bucket
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drcsfa-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npx next dev -H 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
      - NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL=${NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL:-https://github.com/Kish-04/Lets-Collab-App/releases/download/v1.0.0/Let.s.Collab.Setup.0.1.9.exe}
      - NEXT_PUBLIC_FORCE_TURN=${NEXT_PUBLIC_FORCE_TURN:-false}
      - NEXT_PUBLIC_TURN_URL=${NEXT_PUBLIC_TURN_URL:-}
      - NEXT_PUBLIC_TURN_USERNAME=${NEXT_PUBLIC_TURN_USERNAME:-}
      - NEXT_PUBLIC_TURN_CREDENTIAL=${NEXT_PUBLIC_TURN_CREDENTIAL:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
  minio_data:
